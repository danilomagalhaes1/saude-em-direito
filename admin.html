<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel de Leads | Saúde em Direito</title><style>:root{--navy:#102b38;--teal:#4f887f;--bg:#f5f7f6;--line:#dce3e1;--muted:#68777b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17292f}header{background:var(--navy);color:#fff;padding:22px 5vw;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}button,select,input{font:inherit}.wrap{max-width:1400px;margin:auto;padding:32px 5vw}.login{max-width:440px;margin:9vh auto;background:#fff;padding:34px;border:1px solid var(--line);border-radius:14px}.login h1{margin-top:0}.login input{width:100%;padding:13px;margin:7px 0;border:1px solid var(--line)}button{border:0;background:var(--navy);color:#fff;padding:12px 16px;border-radius:7px;cursor:pointer}.msg{font-size:13px;color:#a33;min-height:20px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);padding:18px;border-radius:12px}.stat strong{display:block;font-size:28px}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:10px;justify-content:space-between;margin:18px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid var(--line);background:#fff}.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:15px}.col{background:#edf1f0;border-radius:12px;padding:12px;min-height:250px}.col h3{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:#526368}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 3px 10px rgba(0,0,0,.03)}.card b{display:block;margin-bottom:5px}.card small{display:block;color:var(--muted);margin:4px 0}.card a{color:var(--teal);font-weight:bold;text-decoration:none}.card select{width:100%;margin-top:10px;padding:8px;border:1px solid var(--line)}#logout{background:transparent;border:1px solid #779098}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(4,270px)}.toolbar{display:grid}.toolbar input{width:100%}}</style></head><body><header><b>Saúde em Direito • Leads</b><button id="logout" class="hidden">Sair</button></header><main class="wrap"><section id="loginBox" class="login"><h1>Acesso ao painel</h1><p>Entre com o usuário autorizado no Supabase.</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="loginBtn">Entrar</button><p id="loginMsg" class="msg"></p></section><section id="app" class="hidden"><div class="stats"><div class="stat"><strong id="sTotal">0</strong><span>Total de leads</span></div><div class="stat"><strong id="sNovos">0</strong><span>Novos</span></div><div class="stat"><strong id="sContratos">0</strong><span>Contratos</span></div><div class="stat"><strong id="sPerdidos">0</strong><span>Perdidos</span></div></div><div class="toolbar"><input id="search" placeholder="Buscar nome, telefone ou assunto"><select id="origin"><option value="">Todas as origens</option></select><button id="refresh">Atualizar</button></div><div id="board" class="board"></div></section></main><script src="admin.js"></script></body></html>
