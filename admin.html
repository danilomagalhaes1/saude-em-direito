<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel de Leads | Saúde em Direito</title><style>:root{--n:#102b38;--t:#4f887f;--b:#f5f7f6;--l:#dce3e1;--m:#68777b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--b);color:#17292f}header{background:var(--n);color:white;padding:22px 5vw;display:flex;justify-content:space-between}.wrap{max-width:1400px;margin:auto;padding:32px 5vw}.login{max-width:440px;margin:9vh auto;background:white;padding:34px;border:1px solid var(--l);border-radius:14px}.login input{width:100%;padding:13px;margin:7px 0;border:1px solid var(--l)}button{border:0;background:var(--n);color:white;padding:12px 16px;border-radius:7px;cursor:pointer}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:white;border:1px solid var(--l);padding:16px;border-radius:10px}.stat strong{display:block;font-size:28px}.toolbar{display:flex;gap:10px;margin:20px 0}.toolbar input,.toolbar select,.card select{padding:10px;border:1px solid var(--l)}.toolbar input{flex:1}.board{display:grid;grid-template-columns:repeat(7,minmax(220px,1fr));gap:12px;overflow-x:auto}.col{background:#edf1f0;border-radius:12px;padding:12px;min-height:260px}.col h3{font-size:12px;text-transform:uppercase}.card{margin:10px 0}.card small{display:block;color:var(--m);margin:5px 0}.card a{color:var(--t);font-weight:bold}.card select{width:100%;margin-top:10px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><b>Saúde em Direito • Leads</b><button id="logout" class="hidden">Sair</button></header><main class="wrap"><section id="loginBox" class="login"><h1>Acesso ao painel</h1><p>Entre com o usuário autorizado.</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="loginBtn">Entrar</button><p id="msg"></p></section><section id="app" class="hidden"><div class="stats"><div class="stat"><strong id="total">0</strong>Total</div><div class="stat"><strong id="novos">0</strong>Novos</div><div class="stat"><strong id="contratos">0</strong>Contratos</div><div class="stat"><strong id="perdidos">0</strong>Perdidos</div></div><div class="toolbar"><input id="search" placeholder="Buscar nome, telefone ou assunto"><select id="origin"><option value="">Todas as origens</option></select><button id="refresh">Atualizar</button></div><div id="board" class="board"></div></section></main><script>const BASE='https://bmmxttkfuilbtzcvltbb.supabase.co';const KEY='sb_publishable_5tsXd2E2LQBhaViVmIgsBQ_4VZv4THj';let token='',data=[];const sts=['novo','em_atendimento','qualificado','documentos_recebidos','consulta','contrato','perdido'];const lab={novo:'Novos',em_atendimento:'Em atendimento',qualificado:'Qualificados',documentos_recebidos:'Documentos',consulta:'Consulta',contrato:'Contratos',perdido:'Perdidos'};const $=x=>document.querySelector(x);async function req(p,o={}){let h={apikey:KEY,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;let r=await fetch(BASE+p,{...o,headers:{...h,...(o.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}async function login(){try{$('#msg').textContent='Entrando...';let d=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});token=d.access_token;sessionStorage.setItem('sed_token',token);show();load()}catch(e){console.error(e);$('#msg').textContent='Acesso não autorizado.'}}function show(){$('#loginBox').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden')}async function load(){try{data=await req('/rest/v1/leads?select=*&order=created_at.desc');render()}catch(e){console.error(e);alert('Login realizado, mas este usuário não tem permissão para consultar os leads.')}}function esc(v){let d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function render(){let q=$('#search').value.toLowerCase(),ori=$('#origin').value,f=data.filter(x=>(!q||((x.nome||'')+' '+(x.telefone||'')+' '+(x.assunto||'')).toLowerCase().includes(q))&&(!ori||x.utm_source===ori));$('#total').textContent=data.length;$('#novos').textContent=data.filter(x=>(x.status||'novo')==='novo').length;$('#contratos').textContent=data.filter(x=>x.status==='contrato').length;$('#perdidos').textContent=data.filter(x=>x.status==='perdido').length;let os=[...new Set(data.map(x=>x.utm_source).filter(Boolean))],cur=$('#origin').value;$('#origin').innerHTML='<option value="">Todas as origens</option>'+os.map(x=>'<option '+(x===cur?'selected':'')+'>'+esc(x)+'</option>').join('');$('#board').innerHTML=sts.map(s=>'<section class="col"><h3>'+lab[s]+' ('+f.filter(x=>(x.status||'novo')===s).length+')</h3>'+f.filter(x=>(x.status||'novo')===s).map(card).join('')+'</section>').join('')}function card(x){let t=String(x.telefone||'').replace(/\D/g,'').replace(/^55/,'');return '<article class="card"><b>'+esc(x.nome)+'</b><small>'+esc(x.assunto||'Sem assunto')+'</small><small>'+esc(x.telefone||'')+'</small><small>Origem: '+esc(x.utm_source||x.pagina_origem||'Direto')+'</small>'+(t?'<a target="_blank" href="https://wa.me/55'+t+'">WhatsApp</a>':'')+'<select data-id="'+x.id+'">'+sts.map(s=>'<option value="'+s+'" '+((x.status||'novo')===s?'selected':'')+'>'+lab[s]+'</option>').join('')+'</select></article>'}async function status(id,s){try{await req('/rest/v1/leads?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:s})});let x=data.find(v=>String(v.id)===String(id));if(x)x.status=s;render()}catch(e){console.error(e);alert('Sem permissão para alterar o status.')}}$('#loginBtn').onclick=login;$('#password').onkeydown=e=>{if(e.key==='Enter')login()};$('#logout').onclick=()=>{sessionStorage.removeItem('sed_token');location.reload()};$('#refresh').onclick=load;$('#search').oninput=render;$('#origin').onchange=render;$('#board').onchange=e=>{if(e.target.dataset.id)status(e.target.dataset.id,e.target.value)};token=sessionStorage.getItem('sed_token')||'';if(token){show();load()}</script></body></html>
